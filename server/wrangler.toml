name = "sepay-checker"
main = "shop-worker.js"
compatibility_date = "2026-10-16"

# Khai báo KV Database Namespace (Không chứa bí mật hay secret)
[[kv_namespaces]]
binding = "STORE_KV"
id = "STORE_KV_ID" # Điền ID KV Namespace của bạn trên Cloudflare

# Cron Triggers: Tự động dọn đơn hết hạn sau 24 giờ (mỗi 30 phút quét 1 lần)
[triggers]
crons = ["*/30 * * * *"]
